<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NETWORK 학습 지식베이스</title>
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#172b38;background:#f4f7f8}*{box-sizing:border-box}body{margin:0}header{background:#123746;color:#fff;padding:24px 5vw}h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#d5e8ee}main{padding:24px 5vw;max-width:1500px;margin:auto}.layout{display:grid;grid-template-columns:230px 1fr;gap:24px}nav,article,.material{background:#fff;border:1px solid #dce5e8;border-radius:10px;padding:18px}nav{align-self:start}h2{font-size:20px;margin:0 0 14px}h3{font-size:17px;margin:18px 0 8px}button,select,input,textarea{font:inherit}button{padding:8px 13px;border:1px solid #b2c5cc;border-radius:6px;background:white;color:#123746;cursor:pointer}button:hover{background:#e8f3f5}button:disabled{opacity:.45;cursor:default}button.primary{background:#126675;color:white;border-color:#126675}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e7a344;outline-offset:2px}nav button{display:block;width:100%;text-align:left;margin-bottom:7px;overflow-wrap:anywhere}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}.toolbar input{flex:1;min-width:180px;padding:8px;border:1px solid #b2c5cc;border-radius:6px}.muted{color:#526876}.material{margin:10px 0}.material h3{margin:0}.badge{display:inline-block;padding:2px 8px;background:#e7f2f2;border-radius:5px;font-size:13px;margin-left:8px}.held{color:#8b471b;background:#fff1df}.paths{color:#186575;font-size:14px;overflow-wrap:anywhere}label{display:block;margin-top:14px}textarea{width:100%;min-height:80px;padding:10px;border:1px solid #adc1c8;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f5f6;border-left:3px solid #6a969e;padding:14px;font:13px/1.6 ui-monospace,Consolas,monospace}details{margin:12px 0}summary{cursor:pointer}a{color:#126675}.notice{border-left:4px solid #c18a39;background:#fff4df;padding:12px;margin:12px 0}#message{min-height:25px;color:#135b45}.error{color:#a02b29!important}.source{border-top:1px solid #e1e9eb;margin-top:14px;padding-top:8px}#concepts{margin-top:24px}#concepts details{border-bottom:1px solid #dce5e8;padding:8px}footer{color:#526876;margin:25px 0}.hidden{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;gap:6px}nav h2{width:100%}nav button{width:auto}main{padding:16px}header{padding:20px}button{min-height:42px}}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.unit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.unit{background:#fff;border:1px solid #dce5e8;border-radius:10px;padding:18px}.unit h3{margin-top:0}.unit .badge{margin:0 0 8px}.source{background:#f5f8f9;padding:12px;border-radius:6px}.refs{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}#basis{margin-bottom:20px}.concept{margin:14px 0;padding-bottom:16px;border-bottom:1px solid #dce5e8}button{max-width:100%;overflow-wrap:anywhere}.refs a{overflow-wrap:anywhere}.selected{background:#126675;color:white}.actions{display:flex;gap:10px;margin:16px 0}#queue article{margin-top:18px}nav button{font-size:14px}#detail h2{margin-top:24px}
</style><header><h1>NETWORK 학습 지식베이스</h1><p>학습 주제에서 필요한 개념과 자료로 이어집니다.</p></header>
<main><div class="tabs"><button id="learnTab" class="primary">학습 분류</button><button id="queueTab">승인 대기</button><button id="refresh">새로고침</button><button id="export">승인 결과 저장</button></div>
<div id="message" role="status" aria-live="polite"></div><div id="learning"><div id="basis"></div><div class="toolbar"><input id="search" aria-label="학습 항목·개념 검색" placeholder="학습 항목이나 개념 검색"></div><div class="layout"><nav id="domains" aria-label="학습 영역"></nav><section id="content"></section></div></div>
<section id="queue" class="hidden"><h2>승인이 필요한 자료</h2><p class="muted">승인·보류만 결정합니다. 최종 내용 수정은 Notion에서 진행합니다.</p><div id="queueList"></div></section><article id="detail" class="hidden"></article>
<footer>학습 범위는 명시된 공식 문서 버전에 고정합니다. 보충 항목과 기술 참고자료는 공식 시험 항목과 구분합니다. 이 화면에서는 원문·분류·설명을 수정하지 않습니다.</footer></main>
<script nonce="__TOKEN__">
'use strict';
const token='__TOKEN__';let catalog=null,domainIndex=null,unitIndex=null,mode='learn';const $=id=>document.getElementById(id);const stateNames={pending:'검토 대기',held:'보류',approved:'승인'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':''}
async function request(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(data)}:{});const v=await r.json();if(!r.ok)throw new Error(v.error||'요청 실패');return v}
function button(text,fn,primary=false){const b=el('button',text,primary?'primary':'');b.type='button';b.addEventListener('click',()=>Promise.resolve().then(fn).catch(e=>message(e.message,true)));return b}
function link(title,url){const a=el('a',title);if(/^https?:\/\//i.test(url)){a.href=url;a.target='_blank';a.rel='noopener noreferrer'}return a}
async function load(){catalog=await request('/api/catalog');draw();}
function switchMode(next){mode=next;$('detail').classList.add('hidden');draw()}
function draw(){const map=catalog.curriculum;const pending=catalog.materials.filter(m=>m.status!=='approved');$('queueTab').textContent='승인 대기 ('+pending.length+')';$('learning').classList.toggle('hidden',mode!=='learn');$('queue').classList.toggle('hidden',mode!=='queue');$('learnTab').classList.toggle('primary',mode==='learn');$('queueTab').classList.toggle('primary',mode==='queue');drawQueue(pending);if(!map){$('content').textContent='공식 학습 분류 정책을 먼저 적용하세요.';return}const basis=$('basis');basis.replaceChildren(el('h2',map.title),el('p',map.notice,'muted'),link('공식 학습 범위 원문',map.source_url));const nav=$('domains');nav.replaceChildren(el('h2','학습 순서'),button('전체 영역',()=>{domainIndex=null;unitIndex=null;drawLearning()}));map.domains.forEach((d,i)=>nav.append(button(d.title,()=>{domainIndex=i;unitIndex=null;drawLearning()})));drawLearning()}
function drawLearning(){const map=catalog.curriculum;if(!map)return;const content=$('content'),q=$('search').value.toLocaleLowerCase();content.replaceChildren();$('detail').classList.add('hidden');if(domainIndex!==null&&unitIndex!==null){drawUnit(map.domains[domainIndex],map.domains[domainIndex].units[unitIndex]);return}for(let i=0;i<map.domains.length;i++){if(domainIndex!==null&&i!==domainIndex)continue;const domain=map.domains[i],section=el('section');section.append(el('h2',domain.title));const grid=el('div',undefined,'unit-grid');domain.units.forEach((u,j)=>{if(q&&!u.title.toLocaleLowerCase().includes(q)&&!u.concepts.some(c=>[c.name,...c.aliases].some(n=>n.toLocaleLowerCase().includes(q))))return;const card=el('div',undefined,'unit');card.append(el('div',u.scope==='extension'?'보충 학습':u.code,'badge'),el('h3',u.title),el('p','연결 자료 '+u.material_ids.length+'건 · 개념 '+u.concepts.length+'개','muted'),button('학습 항목 열기',()=>{domainIndex=i;unitIndex=j;drawLearning()},true));grid.append(card)});section.append(grid);content.append(section)}}
function drawUnit(domain,unit){const box=$('content');box.append(button('← '+domain.title,()=>{unitIndex=null;drawLearning()}),el('h2',unit.title),el('p',unit.scope==='extension'?'보충 학습 · 공식 CCNA 명시 항목과 구분합니다.':'공식 범위 대응: '+unit.code,'muted'));const refs=el('div',undefined,'refs');for(const r of unit.references)refs.append(link(r.title,r.url));box.append(refs);if(!unit.concepts.length)box.append(el('p','이 항목에 연결된 개념 자료가 아직 없습니다.','notice'));for(const c of unit.concepts){const card=el('div',undefined,'concept');card.append(el('h3',c.name));for(const s of c.sources){const row=el('div',undefined,'source');row.append(el('p',s.description),button('출처: '+s.filename,()=>show(s.material_id,false)));card.append(row)}box.append(card)}const related=el('details');related.append(el('summary','이 학습 항목의 관련 자료 ('+unit.material_ids.length+')'));for(const id of unit.material_ids){const m=catalog.materials.find(x=>x.id===id);if(m)related.append(button(m.filename,()=>show(id,false)))}box.append(related)}
function drawQueue(materials){const box=$('queueList');box.replaceChildren();if(!materials.length){box.append(el('p','승인 대기 자료가 없습니다.','notice'));return}for(const m of materials){const card=el('div',undefined,'material');card.append(el('h3',m.filename),el('div',stateNames[m.status],'badge'),el('p',m.summary),el('p',[...new Set(m.classification.paths.map(p=>p[1]))].join(' · '),'paths'),button('검토 후 승인·보류',()=>show(m.id,true),true));if(!m.classification.scope_confirmed)card.append(el('div','자동 분류 미확인 주제가 있습니다. 상세에서 사유를 확인하세요.','notice'));if(m.holds.length)card.append(el('div','게시 보류: '+m.holds.join(' '),'notice'));box.append(card)}}
function scopeReview(r){const c=r.classification;const known=c.paths.filter(p=>!p.includes('관련성 미확인')&&(c.reasons||[]).some(reason=>JSON.stringify(reason.path)===JSON.stringify(p)));return {known,partial:!c.scope_confirmed&&!r.holds.length&&known.length>0&&(c.unclassified_topics||[]).length>0};}
function resolve(a,p){return p.split('/').slice(1).reduce((v,k)=>v[k],a)}
function addItem(box,item){const title=item.name||item.title||item.subject||(item.from?item.from+' → '+item.to:null)||(item.subject_a?item.subject_a+' / '+item.subject_b:'분석 항목');box.append(el('h3',title));for(const key of ['relation','description','content'])if(item[key])box.append(el('p',item[key]));if(item.criteria){const ul=el('ul');for(const c of item.criteria)ul.append(el('li',c));box.append(ul)}if(item.evidence){const d=el('details');d.append(el('summary','원문 인용 보기'),el('pre',item.evidence));box.append(d)}}
async function show(id,review){const {record:r,warnings=[]}=await request('/api/material/'+id),a=r.analysis,box=$('detail');box.classList.remove('hidden');box.replaceChildren(button('닫기',()=>box.classList.add('hidden')),el('h2',(review?'승인 검토: ':'출처: ')+a.source.filename),el('p',a.summary),el('p','자료 유형: '+a.material_type.material_type,'muted'));const paths=el('details');paths.append(el('summary','분류 경로'));for(const p of r.classification.paths)paths.append(el('p',p.join(' / ')));box.append(paths);const scope=scopeReview(r);if(!r.classification.scope_confirmed){const unknown=(r.classification.unclassified_topics||[]).map(p=>p.join(' / ')).join(' · ');box.append(el('div','승인 대기 사유: 자동 분류되지 않은 주제'+(unknown?' — '+unknown:'')+(scope.partial?' · 아래 확인란을 선택하면 이미 확인된 분류로 승인할 수 있습니다.':' · 확인된 분류가 없어 분류 검토가 필요합니다.'),'notice'));}for(const warning of warnings)box.append(el('div','안내 · 게시 차단 없음: '+warning,'notice'));if(r.holds.length)box.append(el('div','게시 보류: '+r.holds.join(' '),'notice'));if(review&&r.status!=='approved'){const label=el('label','검토 메모 (선택)'),note=el('textarea');note.value=r.note;label.append(note);box.append(label);let scopeAck=null;if(scope.partial){const label=el('label');scopeAck=document.createElement('input');scopeAck.type='checkbox';label.append(scopeAck,document.createTextNode('미분류 주제를 확인했으며, 확인된 분류로 승인합니다.'));box.append(label);}async function decide(action){await request('/api/decide',{id:r.id,snapshot:r.snapshot,action,note:note.value,confirm_partial_scope:action==='approve'&&!!scopeAck?.checked});message(action==='approve'?'승인했습니다. 대기 목록에서 제외됩니다.':'보류했습니다.');box.classList.add('hidden');await load();window.dispatchEvent(new CustomEvent('review-decision',{detail:{action}}));if(action==='approve'){const next=catalog.materials.find(m=>m.id!==r.id&&m.status==='pending');if(next)await show(next.id,true)}}const actions=el('div',undefined,'actions'),approve=button('승인',()=>decide('approve'),true);function refreshApproval(){approve.disabled=!!r.holds.length||(!r.classification.scope_confirmed&&!scopeAck?.checked);}refreshApproval();if(scopeAck)scopeAck.addEventListener('change',refreshApproval);actions.append(approve,button('보류',()=>decide('hold')));box.append(actions)}for(const s of a.sections||[]){box.append(el('h2',s.title));for(const ref of s.content_refs)addItem(box,resolve(a,ref));if(s.comment){box.append(el('div','❗ '+(s.comment.kind==='correction'?'정정':'보충')+': '+s.comment.text,'notice'));for(const rid of s.comment.reference_ids){const ref=a.references.find(x=>x.id===rid);box.append(link(ref.title,ref.url))}}}if(!a.sections){for(const c of a.concepts||[])addItem(box,c);for(const g of Object.values(a.theory||{}))for(const v of g)addItem(box,v);for(const v of a.practice||[])addItem(box,v)}box.scrollIntoView({behavior:'smooth',block:'start'})}
$('learnTab').addEventListener('click',()=>switchMode('learn'));$('queueTab').addEventListener('click',()=>switchMode('queue'));$('search').addEventListener('input',()=>{unitIndex=null;drawLearning()});$('refresh').addEventListener('click',()=>load().catch(e=>message(e.message,true)));$('export').addEventListener('click',async()=>{try{const r=await request('/api/export',{});message('승인 자료 '+r.count+'건 저장: '+r.path+' · Notion 전송 없음')}catch(e){message(e.message,true)}});load().catch(e=>message(e.message,true));
</script></html>
