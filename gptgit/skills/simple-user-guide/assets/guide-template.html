<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#fff;color:#20252b;font:16px/1.75 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}main{max-width:960px;margin:auto;padding:42px 28px 70px}h1{font-size:29px;line-height:1.4;margin:0 0 12px}h2{font-size:23px;margin:42px 0 16px;padding-bottom:8px;border-bottom:1px solid #d9dee4}h3{font-size:18px;margin:26px 0 10px}p{margin:10px 0}a{color:#245c88;text-underline-offset:3px}.meta{color:#606973;font-size:14px}.note{padding:12px 16px;border-left:3px solid #7893a8;background:#f5f7f9;margin:18px 0}.caution{border-left-color:#a76c32}nav{padding:16px 0;border-bottom:1px solid #d9dee4}nav a{display:inline-block;margin:4px 16px 4px 0}table{border-collapse:collapse;width:100%;font-size:14px;margin:14px 0}th,td{padding:10px 12px;text-align:left;border:1px solid #d9dee4;vertical-align:top}th{background:#f3f5f7}.table-wrap{overflow-x:auto}pre{background:#f5f6f8;border:1px solid #e0e4e8;border-radius:4px;padding:14px 16px;overflow-x:auto;line-height:1.6;font-size:14px}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}p code,li code,td code{background:#f1f3f5;padding:1px 4px;border-radius:3px}li{margin:7px 0}footer{margin-top:40px;border-top:1px solid #d9dee4;padding-top:16px;font-size:13px;color:#606973}@media(max-width:600px){main{padding:24px 16px}h1{font-size:25px}h2{font-size:21px}th,td{padding:8px}pre{font-size:13px}}@media print{main{max-width:none;padding:0}nav{display:none}h2{break-after:avoid}pre,table,.note{break-inside:avoid}a{color:inherit}body{font-size:11pt}}
</style>
</head>
<body><main>
<header><p class="meta">{{PROJECT_VERSION_DATE}}</p><h1>{{TITLE}}</h1><p>{{PURPOSE_AND_FLOW}}</p></header>
<p class="note">{{ENVIRONMENT_AND_WORKING_LOCATION}}</p>
<nav aria-label="목차"><a href="#step1">1. {{STEP_TITLE}}</a></nav>
<section id="step1">
<h2>1. {{STEP_TITLE}}</h2>
<p>{{SHORT_ACTION}}</p>
<pre><code>{{ESSENTIAL_COMMANDS_HTML_ESCAPED}}</code></pre>
<p>{{USED_OPTIONS_BRIEFLY}}</p>
<p><strong>확인:</strong> {{EXPECTED_RESULT}}</p>
</section>
<footer>{{VERSION_DATE_AND_RELEVANT_SOURCES}}</footer>
</main></body></html>
